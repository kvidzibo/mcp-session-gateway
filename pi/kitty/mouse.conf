# Include from kitty.conf; replace with this gateway checkout/package path.
# Use press: Kitty's default right-press selection consumes release in regular mode.
# Also intercept clicks when the fullscreen app grabs the mouse.
# On non-gateway text, double-press retains Kitty's word selection.
mouse_map right press grabbed,ungrabbed kitten /absolute/path/to/gateway/pi/kitty/secondary-click.py
mouse_map left doublepress ungrabbed kitten /absolute/path/to/gateway/pi/kitty/secondary-click.py --double
# Fullscreen: defer Ctrl+Shift primary until Kitty distinguishes single/double.
mouse_map ctrl+shift+left release grabbed,ungrabbed discard_event
mouse_map ctrl+shift+left click grabbed,ungrabbed mouse_handle_click link
mouse_map ctrl+shift+left doublepress grabbed,ungrabbed kitten /absolute/path/to/gateway/pi/kitty/secondary-click.py --double
